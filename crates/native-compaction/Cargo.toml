[package]
name = "native-compaction"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
description = "Provider-agnostic building blocks for context compaction: thresholds, cut selection, break-even cost, capability table and audit records. No I/O."
publish = false

[lib]
path = "../../src/native_compaction/src/lib.rs"

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
