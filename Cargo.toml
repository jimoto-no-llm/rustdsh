[package]
name = "rdsh"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
description = "Local text tools for AI coding and a fast DSH launcher with passthrough"
license = "MIT"
repository = "https://github.com/jimoto-no-llm/rustdsh"
homepage = "https://github.com/jimoto-no-llm/rustdsh"
readme = "README.md"
keywords = ["dsh", "cli", "launcher", "dashboard", "deepseek"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rdsh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
getrandom = "0.4"
libc = "0.2"

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
# Speed-first: opt 3 + fat LTO beats opt-z for launcher + search/token loops.
# Output/behavior unchanged; binary grows slightly (acceptable for absolute speed).
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug-assertions = false
overflow-checks = false
incremental = false
