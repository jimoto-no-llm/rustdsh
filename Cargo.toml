[package]
name = "rdsh"
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port/shim for dsh: fast launcher, token saver, zero behavior breakage via passthrough"
license = "MIT"
repository = "https://github.com/jimoto-no-llm/rustdsh"
homepage = "https://github.com/jimoto-no-llm/rustdsh"
readme = "README.md"
keywords = ["dsh", "cli", "launcher", "dashboard", "deepseek"]
categories = ["command-line-utilities", "development-tools"]
documentation = "https://docs.rs/rdsh"

# crates.io refuses a .crate file over 10 MB and the release archives ship the
# binary alone. Without this list the media, docs and dashboard assets were
# packaged too (~173 MiB compressed) and no publish could ever succeed.
# src/, assets/ and security/ stay: build.rs and the include_str! /
# include_bytes! calls read them at compile time, and scripts/crate-release.py
# fails CI when one of those inputs disappears.
exclude = [
  "/.github/**",
  "/dashboard/**",
  "/desktop/**",
  "/docs/**",
  "/examples/**",
  "/media/**",
  "/mock/**",
  "/plugins/**",
  "/promo-video/**",
  "/scripts/**",
  "/strix_runs/**",
  "/tests/**",
  "/install.ps1",
  "/preview-*",
  "/sync-dsh.sh",
]

[[bin]]
name = "rdsh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order retains JavaScript insertion ordering for native dashboard ports.
# float_roundtrip parses decimal JSON numbers to the same binary64 values as JavaScript.
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
anyhow = "1.0"
getrandom = "0.4"
libc = "0.2"
sha2 = "0.11.0"
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.10"
futures-util = "0.3"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util"] }

[profile.release]
# Speed-first: opt 3 + fat LTO beats opt-z for launcher + search/token loops.
# Output/behavior unchanged; binary grows slightly (acceptable for absolute speed).
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug-assertions = false
overflow-checks = false
incremental = false
