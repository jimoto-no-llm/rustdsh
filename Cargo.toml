[package]
name = "rdsh"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Rust port/shim for dsh: fast launcher, token saver, zero behavior breakage via passthrough"
license = "MIT"
repository = "https://github.com/jimoto-no-llm/rustdsh"
homepage = "https://github.com/jimoto-no-llm/rustdsh"
readme = "README.md"
keywords = ["dsh", "cli", "launcher", "dashboard", "deepseek"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "rdsh"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
getrandom = "0.4"
libc = "0.2"

[build-dependencies]
embed-resource = "=3.0.11"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
