name: Bug report
title: "[Bug] "
description: Something is broken. バグ報告 (Japanese OK).
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `rdsh --version` (or tag/commit).
      placeholder: "v0.2.1"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell, install method.
      placeholder: "Ubuntu 24.04 / bash / install.sh --from-release"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal commands. Include `rdsh doctor` output for DSH delegation bugs. Remove keys, credentials and private paths.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: How are you using rdsh?
      description: DSH is optional for local tools and project MCP.
      options:
        - Local CLI tools only
        - Codex with project MCP
        - Claude Code with project MCP
        - DSH launcher or settings
        - Other MCP client
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen, and what happens instead.
    validations:
      required: true
  - type: textarea
    id: dryrun
    attributes:
      label: Delegation context (if relevant)
      description: For delegation bugs, paste `rdsh --dry-run ...` output.
