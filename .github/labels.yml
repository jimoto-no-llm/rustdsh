# Managed labels. Apply with: sh scripts/sync-labels.sh
# (requires gh CLI with repo scope)
- name: bug
  color: d73a4a
  description: Something is broken
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: performance
  color: f9d0c4
  description: Speed or memory work with numbers
- name: docs
  color: 0075ca
  description: Documentation only
- name: dashboard
  color: 5319e7
  description: dashboard/ Node component
- name: installer
  color: fbca04
  description: install.sh / install.ps1 / release assets
- name: security
  color: b60205
  description: Security-sensitive, handle with care
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: needs-repro
  color: e4e669
  description: Waiting for reproduction steps or doctor output
- name: ja
  color: 0e8a16
  description: Japanese-language thread (Japanese OK)
- name: release
  color: 1d76db
  description: Versioning, release notes, tags and publishing
- name: ci
  color: 0052cc
  description: Builds, tests and GitHub Actions configuration
- name: P0
  color: b60205
  description: Critical security or release blocker
- name: P1
  color: d93f0b
  description: High priority; next milestone
- name: P2
  color: fbca04
  description: Normal priority; planned improvement
- name: P3
  color: c2e0c6
  description: Low priority; backlog
