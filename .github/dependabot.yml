version: 2
updates:
  - package-ecosystem: npm
    directory: /plugins/rdsh-translation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    # Cargo.toml declares rust-version = 1.85 and CI checks it with that
    # toolchain. sha2 0.11.1 raised its own MSRV to 1.88, so that bump has to
    # arrive together with a deliberate MSRV increase, not as a routine update.
    ignore:
      - dependency-name: "sha2"
        versions: [">= 0.11.1"]
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /scripts/headless-runtime/runtime
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    # The headless candidate runtime pins the exact upstream bytes of these
    # packages and verifies their source hashes before it builds. A version
    # update is therefore not a routine bump: it invalidates the pin on
    # purpose. Security alerts still arrive; re-pinning is a reviewed change.
    ignore:
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@deepseek-ai/dsh"
      - dependency-name: "@deepseek-ai/dsh-llm-pi-ai"
      - dependency-name: "ws"
  - package-ecosystem: npm
    directory: /plugins/rdsh-compute
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-llm-muse-code-subscription
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-mcp-exposure
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /media/rdsh-intro
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-mcp-oauth
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/mcp-resource-artifacts
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    ignore:
      # dtolnay/rust-toolchain's ref is the Rust version under test, not an
      # action release: dependabot tried to raise the MSRV pin from 1.85.0 to a
      # nonexistent 1.120.0 (#442). Keep that pin under manual review.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: npm
    directory: /plugins/rdsh-direct-models
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
