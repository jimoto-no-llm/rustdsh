version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /plugins/rdsh-model-call
      - /plugins/rdsh-tui-admin
      - /plugins/dsh-intelligent-ui
      - /plugins/dsh-mobile-maxxing
      - /plugins/dsh-mobile-maxxing/packages/dsh-locale-ja
      - /plugins/dsh-mobile-maxxing/packages/dsh-md-rendering
      - /plugins/dsh-mobile-maxxing/packages/dsh-mobile-maxxing
      - /plugins/rdsh-agent-ui
      - /plugins/rdsh-answer-guard
      - /plugins/rdsh-budget-guard
      - /plugins/rdsh-easy-work
      - /plugins/rdsh-mobile-ui
      - /plugins/rdsh-no-feedback
      - /plugins/rdsh-no-feedback-client
      - /plugins/rdsh-release-probe
      - /plugins/rdsh-session-cleanup
      - /plugins/rdsh-settings
      - /plugins/rdsh-subagent-optimizer
      - /plugins/rdsh-subagent-route
      - /plugins/rdsh-ui-comfort
      - /plugins/rdsh-update-banner
      - /plugins/rdsh-web-cache
      - /plugins/rdsh-web-search-searxng
      - /plugins/workflow-board
      - /scripts/headless-runtime/runtime/plugins/rdsh-session-cleanup
      - /tools/blue-purple
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-llm-native
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tools/compaction-eval
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tools/responses-emulator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-compaction
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-translation
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    # Cargo.toml declares rust-version = 1.85 and CI checks it with that
    # toolchain. sha2 0.11.1 raised its own MSRV to 1.88, so that bump has to
    # arrive together with a deliberate MSRV increase, not as a routine update.
    ignore:
      - dependency-name: "sha2"
        versions: [">= 0.11.1"]
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /scripts/headless-runtime/runtime
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
    # The headless candidate runtime pins the exact upstream bytes of these
    # packages and verifies their source hashes before it builds. A version
    # update is therefore not a routine bump: it invalidates the pin on
    # purpose. Security alerts still arrive; re-pinning is a reviewed change.
    ignore:
      - dependency-name: "@earendil-works/pi-ai"
      - dependency-name: "@deepseek-ai/dsh"
      - dependency-name: "@deepseek-ai/dsh-llm-pi-ai"
      - dependency-name: "ws"
  - package-ecosystem: npm
    directory: /plugins/rdsh-compute
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-llm-muse-code-subscription
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-mcp-exposure
    # DSH peers require matching exact releases; partial bumps break npm ci.
    groups:
      dsh-runtime:
        patterns:
          - "@deepseek-ai/dsh-*"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /media/rdsh-intro
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-mcp-oauth
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/mcp-resource-artifacts
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    ignore:
      # dtolnay/rust-toolchain's ref is the Rust version under test, not an
      # action release: dependabot tried to raise the MSRV pin from 1.85.0 to a
      # nonexistent 1.120.0 (#442). Keep that pin under manual review.
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: npm
    directory: /plugins/rdsh-direct-models
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-devin-cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /plugins/rdsh-ptc-catalog
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /desktop/sdk
    # DSH cohorts must move together; the sdk contract suite pins the
    # matching dsh-client-ui-slots release next to dsh-sdk-client.
    groups:
      dsh-runtime:
        patterns:
          - "@deepseek-ai/dsh-*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /plugins/rdsh-direct-models
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
