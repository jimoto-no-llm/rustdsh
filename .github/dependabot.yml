version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    ignore:
      # dtolnay/rust-toolchain's ref is the Rust version under test, not an
      # action release: dependabot tried to raise the MSRV pin from 1.85.0 to a
      # nonexistent 1.120.0 (#442). Keep that pin under manual review.
      - dependency-name: "dtolnay/rust-toolchain"
