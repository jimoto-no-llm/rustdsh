name: dashboard

on:
  push:
    paths: ["dashboard/**", "assets/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", "assets/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap
      - run: npm ci
      - if: runner.os == 'Windows'
        # Native GUI startup must not compete with every process-heavy fixture.
        # Run every test with the same assertions and startup deadlines.
        run: node --test --test-concurrency=1 test/*.test.mjs
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          # A delegated service owns only this test run's cgroup; no global PID signals.
          sudo systemd-run --unit="rdsh-dashboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" npm test

  fault-simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory ../fault-simulator-results | Out-Null
          node fault-simulator.mjs run --seed 1 --output ../fault-simulator-results/run
          $faultRunCode = $LASTEXITCODE
          node fault-simulator.mjs replay --manifest ../fault-simulator-results/run/input.json --output ../fault-simulator-results/replay
          $faultReplayCode = $LASTEXITCODE
          node fault-simulator.mjs run --scenario disk_full --seed 0 --output ../fault-simulator-results/write-full
          if ($faultRunCode -ne 0 -or $faultReplayCode -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir ../fault-simulator-results
          sudo systemd-run --unit="rdsh-fault-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" \
            bash -c 'set -eu; node fault-simulator.mjs run --seed 1 --output ../fault-simulator-results/run; node fault-simulator.mjs replay --manifest ../fault-simulator-results/run/input.json --output ../fault-simulator-results/replay; node fault-simulator.mjs run --scenario disk_full --seed 0 --output ../fault-simulator-results/write-full'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fault-simulator-${{ matrix.os }}
          path: fault-simulator-results/
          if-no-files-found: error
