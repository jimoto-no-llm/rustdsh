name: dashboard

on:
  push:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - if: runner.os == 'Windows'
        run: npm test
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          # A delegated service owns only this test run's cgroup; no global PID signals.
          sudo systemd-run --unit="rdsh-dashboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" npm test
