name: dashboard

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      [
        "dashboard/**",
        "assets/**",
        "src/main.rs",
        "src/worker_git.rs",
        "scripts/bench-worker-git.mjs",
        "Cargo.toml",
        "Cargo.lock",
        ".github/workflows/dashboard.yml",
      ]
  pull_request:
    paths:
      [
        "dashboard/**",
        "assets/**",
        "src/main.rs",
        "src/worker_git.rs",
        "scripts/bench-worker-git.mjs",
        "Cargo.toml",
        "Cargo.lock",
        ".github/workflows/dashboard.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the native dashboard Git bridge
        run: cargo build --locked --manifest-path ../Cargo.toml --bin rdsh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - if: runner.os == 'Windows'
        name: Measure worker Git bridge latency
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path ../Cargo.toml --bin rdsh
          $env:RDSH_BENCH_BIN = (Resolve-Path ../target/release/rdsh.exe).Path
          node ../scripts/bench-worker-git.mjs
      - if: runner.os == 'Windows'
        # Native GUI startup must not compete with every process-heavy fixture.
        # Run every test with the same assertions and startup deadlines.
        run: node --test --test-concurrency=1 test/*.test.mjs
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          # A delegated service owns only this test run's cgroup; no global PID signals.
          sudo systemd-run --unit="rdsh-dashboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" npm test

  fault-simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $outputRoot = "../fault-simulator-results/attempt-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force $outputRoot | Out-Null
          node fault-simulator.mjs run --seed 1 --output "$outputRoot/run"
          $faultRunCode = $LASTEXITCODE
          node fault-simulator.mjs replay --manifest "$outputRoot/run/input.json" --output "$outputRoot/replay"
          $faultReplayCode = $LASTEXITCODE
          node fault-simulator.mjs run --scenario disk_full --seed 0 --output "$outputRoot/write-full"
          if ($faultRunCode -ne 0 -or $faultReplayCode -ne 0 -or $LASTEXITCODE -ne 0) { exit 1 }
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          output_root="../fault-simulator-results/attempt-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$output_root"
          sudo systemd-run --unit="rdsh-fault-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" RDSH_FAULT_OUTPUT_ROOT="$output_root" \
            bash -c 'set -eu; node fault-simulator.mjs run --seed 1 --output "$RDSH_FAULT_OUTPUT_ROOT/run"; node fault-simulator.mjs replay --manifest "$RDSH_FAULT_OUTPUT_ROOT/run/input.json" --output "$RDSH_FAULT_OUTPUT_ROOT/replay"; node fault-simulator.mjs run --scenario disk_full --seed 0 --output "$RDSH_FAULT_OUTPUT_ROOT/write-full"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fault-simulator-${{ matrix.os }}
          path: fault-simulator-results/
          if-no-files-found: error
