name: cd

# Release binaries on version tags: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rdsh
            pkg: rdsh-linux-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: rdsh
            pkg: rdsh-linux-x64-musl.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rdsh
            pkg: rdsh-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: rdsh
            pkg: rdsh-macos-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rdsh.exe
            pkg: rdsh-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.pkg }} -C target/${{ matrix.target }}/release ${{ matrix.bin }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath ${{ matrix.pkg }}
      # Sidecar checksum per asset (distinct names, no matrix race).
      # install.sh verifies it and refuses mismatches.
      - if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.pkg }} > ${{ matrix.pkg }}.sha256
      - if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash -Algorithm SHA256 ${{ matrix.pkg }}).Hash.ToLower() | Out-File -NoNewline -Encoding ascii ${{ matrix.pkg }}.sha256
      # Ship the installers alongside the binaries so releases are one-liners:
      #   curl -fsSL .../releases/latest/download/install.sh | bash -s -- --from-release
      # Installers go up from the gnu Linux job only: same filenames from every
      # matrix job race on delete+re-upload, and Windows checkouts use CRLF.
      - if: runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.pkg }}
            ${{ matrix.pkg }}.sha256
            install.sh
            install.ps1
          draft: true
          generate_release_notes: true
      # Notes are generated by the gnu Linux job only: every upload
      # rewrites the release body, so parallel jobs would duplicate it.
      - if: runner.os != 'Linux' || matrix.target != 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: false
          files: |
            ${{ matrix.pkg }}
            ${{ matrix.pkg }}.sha256


  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify complete release assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/rdsh-release-check"
          mkdir -p "$directory"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$directory"
          python3 scripts/verify-release-assets.py "$directory"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "docs/releases/$RELEASE_TAG.md" --draft=false --latest
