name: cd

# Release binaries on annotated version tags; follow docs/RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require an annotated version tag, main ancestry, and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          python3 scripts/prepare-release.py "$RELEASE_TAG"
          tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${tag_sha}/check-runs?per_page=100" > "$RUNNER_TEMP/release-check-runs.json"
          python3 scripts/release_ci.py "$tag_sha" "$RUNNER_TEMP/release-check-runs.json" --main-ref FETCH_HEAD
      - run: python3 -m unittest discover -s tests -p 'test_release_*.py'

  release:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rdsh
            pkg: rdsh-linux-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: rdsh
            pkg: rdsh-linux-x64-musl.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rdsh
            pkg: rdsh-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: rdsh
            pkg: rdsh-macos-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rdsh.exe
            pkg: rdsh-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.pkg }} -C target/${{ matrix.target }}/release ${{ matrix.bin }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.bin }}" -DestinationPath ${{ matrix.pkg }}
      # Sidecar checksum per asset (distinct names, no matrix race).
      # install.sh verifies it and refuses mismatches.
      - if: runner.os != 'Windows'
        run: sha256sum ${{ matrix.pkg }} > ${{ matrix.pkg }}.sha256
      - if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash -Algorithm SHA256 ${{ matrix.pkg }}).Hash.ToLower() | Out-File -NoNewline -Encoding ascii ${{ matrix.pkg }}.sha256
      # Stage builds without creating or modifying a GitHub release.
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.pkg }}
            ${{ matrix.pkg }}.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/rdsh-release-check
      - name: Verify all assets and compose the v0.2.0 release format
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/rdsh-release-check"
          cp install.sh install.ps1 "$directory/"
          python3 scripts/verify-release-assets.py "$directory"
          python3 scripts/prepare-release.py "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --output "$RUNNER_TEMP/release-notes.md"
      - name: Upload to a draft and publish with the correct channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/rdsh-release-check"
          # Retry only an existing draft. Published releases must never be overwritten.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Preserve draft assets on retries. Compare all existing bytes first.
          existing="$RUNNER_TEMP/rdsh-release-existing"
          mkdir -p "$existing"
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -gt 0 ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$existing"
          fi
          python3 scripts/verify-release-assets.py "$directory" --existing-directory "$existing" --missing-output "$RUNNER_TEMP/release-missing"
          mapfile -t pending < "$RUNNER_TEMP/release-missing"
          if [ "${#pending[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" "${pending[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          # Re-download and check the actual release assets before publication.
          uploaded="$RUNNER_TEMP/rdsh-release-uploaded"
          mkdir -p "$uploaded"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$uploaded"
          python3 scripts/verify-release-assets.py "$uploaded"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease=false --latest
          fi
