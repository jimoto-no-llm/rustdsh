name: rust-audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      # deny.toml pins the allowed dependency licenses and registries, so a
      # copyleft license or an unknown registry fails on the pull request that
      # adds it instead of at release time. Advisories stay with cargo audit.
      - name: Check dependency licenses and registries
        run: cargo deny check licenses sources
