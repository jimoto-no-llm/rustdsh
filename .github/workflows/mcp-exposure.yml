name: mcp-exposure

on:
  push:
    paths:
      - 'plugins/rdsh-mcp-exposure/**'
      - 'security/**'
      - '.github/workflows/mcp-exposure.yml'
  pull_request:
    paths:
      - 'plugins/rdsh-mcp-exposure/**'
      - 'security/**'
      - '.github/workflows/mcp-exposure.yml'

permissions:
  contents: read

concurrency:
  group: mcp-exposure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exposure-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: plugins/rdsh-mcp-exposure/package-lock.json
      - run: npm ci --prefix plugins/rdsh-mcp-exposure --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix plugins/rdsh-mcp-exposure
      - run: node plugins/rdsh-mcp-exposure/benchmark.mjs --output mcp-exposure-benchmark.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-exposure-${{ runner.os }}
          path: mcp-exposure-benchmark.json
