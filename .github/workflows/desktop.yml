name: desktop

on:
  pull_request:
    paths: ['apps/rdsh-desktop/**']
  push:
    branches: [main]
    paths: ['apps/rdsh-desktop/**']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/rdsh-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
