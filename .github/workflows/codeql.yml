name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

# Key on the branch, not `github.ref`: a branch push uses `refs/heads/<branch>`
# while its pull request uses `refs/pull/<n>/merge`, so a ref-keyed group lets
# both run for the same commit. `head_ref` is empty on a push to a branch in
# this repository, so fall back to `ref_name`.
concurrency:
  group: codeql-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
