name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/plugin-security.test.mjs tests/settings-client.test.mjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            regress: true
          - os: macos-latest
            regress: true
          - os: windows-latest
            regress: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build
      - if: matrix.regress
        shell: bash
        run: |
          printf '#!/bin/sh\necho stub-dsh $@' > /tmp/stub-dsh && chmod +x /tmp/stub-dsh
          BIN=./target/debug/rdsh DSH_ORIG_BIN=/tmp/stub-dsh sh tests/regress.sh
      - if: '! matrix.regress'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'rdsh-smoke'
          $h = Join-Path $tmp 'home'
          $d = Join-Path $tmp 'dsh'
          New-Item -ItemType Directory -Force -Path $h, $d | Out-Null
          $env:HOME = $h
          $env:DSH_HOME = $d
          $env:DSH_ORIG_BIN = (Resolve-Path ./target/debug/rdsh.exe).Path
          ./target/debug/rdsh.exe --version
          $auth = ./target/debug/rdsh.exe auth --json | Out-String
          if ($auth -notmatch 'records') { throw 'auth json missing records field' }
          $setup = ./target/debug/rdsh.exe setup --json | Out-String
          if ($setup -notmatch '"needed":true') { throw 'setup should report needed on first run' }
          ./target/debug/rdsh.exe doctor
