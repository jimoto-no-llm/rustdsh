name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-runtime-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix dashboard
      - name: Install only public native test dependencies
        run: npm install --prefix "${{ runner.temp }}/rdsh-plan-native" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-workflow-ptc@0.2.0-rc.2 @deepseek-ai/dsh-subagent@0.2.0-rc.2 @deepseek-ai/dsh-subagent-spawn-in-process@0.2.0-rc.2 @deepseek-ai/cordis@4.0.4
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemd-run --unit="rdsh-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" \
            RDSH_TEST_PLAN_PACKAGE="$RUNNER_TEMP/rdsh-plan-native/package.json" \
            node --test tests/plan-runtime-native.test.mjs
      - if: runner.os == 'Windows'
        run: node --test tests/plan-runtime-native.test.mjs
        env:
          RDSH_TEST_PLAN_PACKAGE: ${{ runner.temp }}/rdsh-plan-native/package.json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo check --locked --all-targets

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release metadata and asset validation
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'
      - name: Check the current version's release notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/prepare-release.py "v$version"

  update-banner-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/update-banner.test.mjs

  plugin-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/plugin-security.test.mjs tests/settings-client.test.mjs tests/update-banner.test.mjs tests/model_benchmark/fence.test.mjs

  security-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node --test tests/security-boundaries.test.mjs tests/tool-isolation.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_release_assets.py'
      - name: Verify the audited dispatcher and late middleware changes
        run: |
          npm install --prefix "$RUNNER_TEMP/rdsh-runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-tools@0.2.0-rc.2
          RDSH_TOOL_RUNTIME="$RUNNER_TEMP/rdsh-runtime/node_modules/@deepseek-ai/dsh-tools/lib/index.js" RDSH_SECURE_WORKSPACE="$GITHUB_WORKSPACE" RDSH_SHARED_FILES='[]' node --import ./security/preload.mjs tests/guarded-runtime-probe.mjs

  lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            regress: true
          - os: macos-latest
            regress: true
          - os: windows-latest
            regress: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd
      - run: cargo test
      - run: cargo test --example benchmark_extended
      - run: cargo test --example benchmark_models
      - run: cargo build
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/runtime-compatibility.test.mjs tests/icon-assets.test.mjs
      - if: matrix.regress
        shell: bash
        run: |
          printf '#!/bin/sh\necho stub-dsh $@' > /tmp/stub-dsh && chmod +x /tmp/stub-dsh
          BIN=./target/debug/rdsh DSH_ORIG_BIN=/tmp/stub-dsh sh tests/regress.sh
      - if: "! matrix.regress"
        shell: pwsh
        run: |
          ./tests/installer-security.ps1
          ./tests/icon-assets.ps1
          $tmp = Join-Path $env:RUNNER_TEMP 'rdsh-smoke'
          $h = Join-Path $tmp 'home'
          $d = Join-Path $tmp 'dsh'
          New-Item -ItemType Directory -Force -Path $h, $d | Out-Null
          $env:HOME = $h
          $env:DSH_HOME = $d
          $env:DSH_ORIG_BIN = (Resolve-Path ./target/debug/rdsh.exe).Path
          ./target/debug/rdsh.exe --version
          $auth = ./target/debug/rdsh.exe auth --json | Out-String
          if ($auth -notmatch 'records') { throw 'auth json missing records field' }
          $setup = ./target/debug/rdsh.exe setup --json | Out-String
          if ($setup -notmatch '"needed":true') { throw 'setup should report needed on first run' }
          ./target/debug/rdsh.exe doctor

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --release
      - run: npm ci --prefix dashboard
      - run: npm ci --prefix tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test --prefix tests/e2e
        env:
          RDSH_E2E_BIN: ./target/release/rdsh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-e2e
          path: target/e2e
