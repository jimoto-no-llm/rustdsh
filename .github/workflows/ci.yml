name: ci

# PRs validate the merge result. Do not duplicate their matrix on branch pushes;
# main and version tags retain full validation, including the release CI gate.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-runtime-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --prefix dashboard
      - name: Install only public native test dependencies
        run: npm install --prefix "${{ runner.temp }}/rdsh-plan-native" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-workflow-ptc@0.2.0-rc.2 @deepseek-ai/dsh-subagent@0.2.0-rc.2 @deepseek-ai/dsh-subagent-spawn-in-process@0.2.0-rc.2 @deepseek-ai/cordis@4.0.4
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo systemd-run --unit="rdsh-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" \
            RDSH_TEST_PLAN_PACKAGE="$RUNNER_TEMP/rdsh-plan-native/package.json" \
            node --test tests/plan-runtime-native.test.mjs
      - if: runner.os == 'Windows'
        run: node --test tests/plan-runtime-native.test.mjs
        env:
          RDSH_TEST_PLAN_PACKAGE: ${{ runner.temp }}/rdsh-plan-native/package.json

  # Keep required PR/main/tag names stable; distinguish the fully executed branch-push run.
  msrv:
    name: "msrv${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo +1.85.0 check --locked --all-targets

  release-policy:
    name: "release-policy${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release metadata and asset validation
        run: python3 -m unittest discover -s tests -p 'test_release_*.py'
      - name: Test ICO directory validation
        run: python3 -m unittest discover -s tests -p 'test_icon_generation.py'
      - name: Test branch cleanup safeguards
        run: python3 -m unittest discover -s tests -p 'test_branch_cleanup.py'
      - name: Check the current version's release notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/prepare-release.py "v$version"

  crate-package:
    name: "crate-package${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Keep the crate inside the registry limits
        run: python3 scripts/crate-release.py check
      - name: Build the crate from its packaged file list
        run: cargo package --locked

  update-banner-windows:
    name: "update-banner-windows${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/update-banner.test.mjs

  fedora:
    name: Fedora packages
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    steps:
      # The package names here are the ones docs/FEDORA.md documents; if Fedora
      # renames one, this job fails before a user hits it.
      - run: dnf install -y --setopt=install_weak_deps=False git gcc gcc-c++ make cargo zstd bubblewrap nodejs python3 tar gzip curl diffutils findutils
      - uses: actions/checkout@v7
      - run: cargo build --locked
      - run: cargo test --locked
      - name: doctor reports the Fedora dependency state
        run: './target/debug/rdsh doctor | grep -F "[rdsh] fedora: optional tools present (zstd, bubblewrap)"'
      - name: Regress with a stub dsh
        shell: bash
        run: |
          printf '#!/bin/sh\necho stub-dsh $@' > /tmp/stub-dsh && chmod +x /tmp/stub-dsh
          BIN=./target/debug/rdsh DSH_ORIG_BIN=/tmp/stub-dsh sh tests/regress.sh

  plugin-security:
    name: "plugin-security${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - name: Populate the pinned headless runtime cache
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/headless-runtime/runtime
      - name: Test plugin and hook contracts
        run: node --test tests/plugin-security.test.mjs tests/plugin-install.test.mjs tests/settings-client.test.mjs tests/japanese-locale.test.mjs tests/update-banner.test.mjs tests/rdsh-mobile-ui.test.mjs tests/answer-guard.test.mjs tests/answer-guard-locale.test.mjs tests/feature-switches.test.mjs tests/discord-presence.test.mjs tests/model_benchmark/fence.test.mjs tests/context_inject_contract.mjs tests/settings-sanitize.test.mjs tests/translation-core.test.mjs tests/translation-client-crlf.test.mjs plugins/rdsh-ui-comfort/test/logic.test.mjs plugins/mcp-resource-artifacts/tests/source-patch.test.mjs
        env:
          BIN: ${{ github.workspace }}/target/debug/rdsh
          DSH_HOOK_PROTOCOL: ${{ github.workspace }}/scripts/headless-runtime/runtime/node_modules/@deepseek-ai/dsh-hook-protocol/lib/index.js
          RDSH_HOOK_CODEC_REQUIRED: '1'
      - name: Install pinned public DSH APIs for the optional plugins
        run: npm install --prefix "$RUNNER_TEMP/rdsh-public-api" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-subagent@0.2.0-rc.2 @deepseek-ai/dsh-tool-subagent@0.2.0-rc.2 @deepseek-ai/dsh-client-ui-slots@0.2.0-rc.2
      - name: Check native API compatibility without model or authentication calls
        run: RDSH_PUBLIC_DSH_MODULES="$RUNNER_TEMP/rdsh-public-api/node_modules" node --test plugins/rdsh-subagent-optimizer/test/*.test.mjs plugins/rdsh-easy-work/test/*.test.mjs
      - name: Build and test the offline headless runtime
        run: |
          node scripts/headless-runtime/build-candidate.mjs --out "$RUNNER_TEMP/rdsh-headless-candidate"
          RDSH_CANDIDATE="$RUNNER_TEMP/rdsh-headless-candidate" node --test scripts/headless-runtime/test/*.test.mjs plugins/rdsh-session-cleanup/test/*.test.mjs
          for language in en zh-CN ja; do
            RDSH_LANG="$language" RDSH_NATIVE_MODULES="$RUNNER_TEMP/rdsh-headless-candidate/node_modules" node tests/e2e/answer-guard-native.mjs
          done

  muse-subscription:
    name: "muse-subscription (${{ matrix.os }})${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/rdsh-llm-muse-code-subscription
      - run: npm test
        working-directory: plugins/rdsh-llm-muse-code-subscription

  security-boundaries:
    name: "security-boundaries${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install audited DSH runtime matrix
        run: |
          set -eu
          for pair in \
            'RC2 0.2.0-rc.2' \
            'ALPHA1 0.2.1-alpha.1' \
            'ALPHA3 0.2.1-alpha.3'
          do
            label=${pair%% *}
            version=${pair#* }
            prefix="$RUNNER_TEMP/rdsh-runtime-$label"
            npm install --prefix "$prefix" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@$version"
            dsh="$prefix/node_modules/@deepseek-ai/dsh/lib/bin.js"
            test -f "$dsh"
            runtime=$(node -e 'const { createRequire } = require("node:module"); process.stdout.write(createRequire(process.argv[1]).resolve("@deepseek-ai/dsh-tools"))' "$dsh")
            test "$runtime" = "$prefix/node_modules/@deepseek-ai/dsh-tools/lib/index.js"
            test -f "$runtime"
            echo "RDSH_AUDITED_DSH_${label}=$dsh" >> "$GITHUB_ENV"
            echo "RDSH_AUDITED_RUNTIME_${label}=$runtime" >> "$GITHUB_ENV"
          done
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo test --locked tool_security
      - run: node --test tests/security-boundaries.test.mjs tests/tool-isolation.test.mjs tests/desktop.test.mjs tests/opencode-session-header.test.mjs
      - name: Verify Rust launcher, official profiles and kernel enforcement together
        run: RDSH_GUARDED_MATRIX_REQUIRED=1 node --test tests/guarded-launcher-matrix.test.mjs
      - name: Install pinned upstream tool-bash for approval integrity test
        run: npm install --prefix "$RUNNER_TEMP/rdsh-runtime" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh-tool-bash@0.2.0-rc.2
      - name: Test approval integrity against pinned upstream source
        run: DSH_TOOL_BASH_SOURCE="$RUNNER_TEMP/rdsh-runtime/node_modules/@deepseek-ai/dsh-tool-bash/lib/index.js" node --test tests/upstream-approval-integrity.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_release_assets.py'
      - name: Verify preserved DSH modes and isolated inspection
        run: |
          npm ci --prefix plugins/rdsh-ptc-catalog --ignore-scripts --no-audit --no-fund
          RDSH_TOOL_RUNTIME="$GITHUB_WORKSPACE/plugins/rdsh-ptc-catalog/node_modules/@deepseek-ai/dsh-tools/lib/index.js" RDSH_SECURE_WORKSPACE="$GITHUB_WORKSPACE" RDSH_SHARED_FILES='[]' node --import ./security/preload.mjs tests/guarded-runtime-probe.mjs

  lint:
    name: "Rust lint${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: "test (${{ matrix.os }}, ${{ matrix.regress }})${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            regress: true
          - os: macos-latest
            regress: true
          - os: windows-latest
            regress: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - if: runner.os == 'Linux'
        run: command -v zstd || (sudo apt-get update && sudo apt-get install -y zstd)
      - if: runner.os == 'macOS'
        run: command -v zstd || brew install zstd
      - name: Run Rust tests
        run: cargo nextest run --locked --all-targets --profile ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-tests-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
      - name: 並列開発ツールの回帰検査
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p 'test_parallel_dev.py' -v
        env:
          RDSH_PARALLEL_TEST_TMPDIR: ${{ github.workspace }}/.tmp-parallel-dev-tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test plugins/workflow-board/tests/source-patch.test.mjs
      - run: cargo build
      - name: Test localized setup in a real terminal
        if: runner.os != 'Windows'
        run: python3 tests/e2e/cli-tty.py
        env:
          RDSH_E2E_BIN: ./target/debug/rdsh
      - name: Test localized setup in a real Windows terminal
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/e2e/cli-tty-windows.ps1
        env:
          RDSH_E2E_BIN: ./target/debug/rdsh.exe
      - run: node --test dashboard/test/worker-scopes-compat.test.mjs

      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins/rdsh-compute
      - run: npm test
        working-directory: plugins/rdsh-compute
        env:
          RDSH_BIN: ${{ runner.os == 'Windows' && format('{0}/target/debug/rdsh.exe', github.workspace) || format('{0}/target/debug/rdsh', github.workspace) }}
      - run: node --test tests/runtime-compatibility.test.mjs tests/icon-assets.test.mjs tests/desktop.test.mjs
      - if: runner.os == 'Windows'
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/headless-runtime/runtime
      - if: runner.os == 'Windows'
        run: node --test tests/context_inject_contract.mjs
        env:
          BIN: ${{ github.workspace }}/target/debug/rdsh.exe
          DSH_HOOK_PROTOCOL: ${{ github.workspace }}/scripts/headless-runtime/runtime/node_modules/@deepseek-ai/dsh-hook-protocol/lib/index.js
          RDSH_HOOK_CODEC_REQUIRED: '1'
      - if: matrix.regress
        shell: bash
        run: |
          printf '#!/bin/sh\necho stub-dsh $@' > /tmp/stub-dsh && chmod +x /tmp/stub-dsh
          BIN=./target/debug/rdsh DSH_ORIG_BIN=/tmp/stub-dsh sh tests/regress.sh
          BIN=./target/debug/rdsh sh tests/context_prototype.sh
          BIN=./target/debug/rdsh sh tests/context_hook_prototype.sh
          BIN=./target/debug/rdsh sh tests/deps_prototype.sh
          BIN=./target/debug/rdsh sh tests/settings_prototype.sh
      - if: '! matrix.regress'
        shell: pwsh
        run: |
          # install.ps1 cannot be executed end to end without a release, but its
          # syntax (including the Desktop block) is parsed here on every run.
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          ./tests/installer-security.ps1
          ./tests/installer-security.ps1 -Version v0.0.0-rc.1
          ./tests/icon-assets.ps1
          $tmp = Join-Path $env:RUNNER_TEMP 'rdsh-smoke'
          $h = Join-Path $tmp 'home'
          $d = Join-Path $tmp 'dsh'
          New-Item -ItemType Directory -Force -Path $h, $d | Out-Null
          $env:HOME = $h
          $env:DSH_HOME = $d
          $env:DSH_ORIG_BIN = (Resolve-Path ./target/debug/rdsh.exe).Path
          ./target/debug/rdsh.exe --version
          $auth = ./target/debug/rdsh.exe auth --json | Out-String
          if ($auth -notmatch 'records') { throw 'auth json missing records field' }
          $setup = ./target/debug/rdsh.exe setup --json | Out-String
          if ($setup -notmatch '"needed":true') { throw 'setup should report needed on first run' }
          ./target/debug/rdsh.exe doctor
      - if: '! matrix.regress'
        shell: bash
        run: BIN=./target/debug/rdsh.exe bash tests/regress.sh --windows-installer-delegation

  # Records the CLI fast-path trend on every run. It deliberately passes no
  # --baseline: a fresh runner has no previous binary, and comparing against a
  # stale artifact would fail spuriously. The JSON is uploaded for trend review
  # and the job only asserts that every case produced correct output.
  perf-regression:
    name: "perf-regression${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --example benchmark_regression
      - run: cargo build --release
      - name: Measure the CLI fast paths
        run: |
          cargo run --release --example benchmark_regression -- \
            --bin ./target/release/rdsh --n 15 \
            --output "$RUNNER_TEMP/rdsh-perf.json"
      - name: Assert the report exists and every case is correct
        run: |
          python3 - <<'PY'
          import json, os, sys

          path = os.path.join(os.environ["RUNNER_TEMP"], "rdsh-perf.json")
          if not os.path.exists(path):
              sys.exit(f"perf report was not produced at {path}")

          with open(path, encoding="utf-8") as handle:
              report = json.load(handle)

          cases = report.get("cases") or {}
          if not cases:
              sys.exit("perf report contains no cases")

          bad = []
          for name, case in cases.items():
              if case.get("correct") is not True:
                  bad.append(f"{name}: {case.get('outcome')}")
              if case.get("outcome") == "failed":
                  bad.append(f"{name}: marked failed")
              if "median_ms" not in case or "p95_ms" not in case:
                  bad.append(f"{name}: missing median/p95")
              if not case.get("samples_ms"):
                  bad.append(f"{name}: no samples")
          if report.get("failures"):
              bad.append(f"failures: {report['failures']}")
          if bad:
              sys.exit("perf regression report is not clean:\n  " + "\n  ".join(bad))
          print(f"{len(cases)} cases correct")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-regression
          path: ${{ runner.temp }}/rdsh-perf.json

  browser-e2e:
    name: "browser-e2e${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build --release
      - run: npm ci --prefix dashboard
      - run: npm ci --prefix tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: |
          sudo systemd-run --unit="rdsh-browser-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --wait --pipe --collect --property=Delegate=yes \
            --property=DelegateSubgroup=supervisor --uid="$(id -u)" \
            --working-directory="$PWD" /usr/bin/env HOME="$HOME" PATH="$PATH" \
            RDSH_E2E_BIN="$RDSH_E2E_BIN" npm test --prefix tests/e2e
        env:
          RDSH_E2E_BIN: ./target/release/rdsh
          RDSH_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # The rdsh-ui-comfort DOM test drives a real Chromium, so it belongs to
      # this job: without playwright-core it silently skips instead of proving
      # the bundle's key handling.
      - run: RDSH_PLAYWRIGHT_CORE="$PWD/tests/e2e/node_modules/playwright-core" node --test plugins/rdsh-ui-comfort/test/dom.playwright.test.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-e2e
          path: target/e2e

  # Installs the built artifacts with install.sh inside clean containers
  # (--network=none, file:// release base). This is the check that keeps a
  # fresh-machine install working on older glibc distros and musl hosts; see
  # tests/install-isolated/ and docs/RELEASING.md.
  install-isolated:
    name: "Isolated install${{ github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.default_branch && github.ref_name != github.event.repository.default_branch && ' [branch push]' || '' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - run: tests/install-isolated.sh --source local --no-build --require-musl
