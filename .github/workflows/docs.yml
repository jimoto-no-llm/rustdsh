name: docs

on:
  push:
    paths:
      - '**/*.md'
      - '.markdownlint.yml'
      - '.lychee.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yml'
      - '.lychee.toml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

# Key on the branch, not `github.ref`: a branch push uses `refs/heads/<branch>`
# while its pull request uses `refs/pull/<n>/merge`, so a ref-keyed group lets
# both run for the same commit. `head_ref` is empty on a push to a branch in
# this repository, so fall back to `ref_name`.
concurrency:
  group: docs-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Resolve former-owner links after the repository transfer, while
          # keeping the destination issue, file and release checks enabled.
          args: >-
            --config .lychee.toml --verbose --no-progress
            --remap '^https://github[.]com/sahenjp/rustdsh(/.*)?$ https://github.com/jimoto-no-llm/rustdsh$1'
            README.md README.ja.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md docs/**/*.md dashboard/README.md
          fail: true
