name: docs

on:
  push:
    paths:
      - '**/*.md'
      - '.markdownlint.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md'
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # x.com returns 403 to link-checker bots; the links are fine for humans.
          # Check transferred repository URLs at their canonical owner.
          args: >-
            --verbose --no-progress --exclude x\.com
            --remap '^https://github[.]com/sahenjp/rustdsh(/.*)?$ https://github.com/jimoto-no-llm/rustdsh$1'
            README.md README.ja.md CHANGELOG.md CONTRIBUTING.md SECURITY.md SUPPORT.md docs/**/*.md dashboard/README.md
          fail: true
