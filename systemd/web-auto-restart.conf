# Drop-in for an existing dsh-web.service or rdsh-web.service.
[Unit]
# Keep retrying after repeated crashes; RestartSec limits retry frequency.
StartLimitIntervalSec=0

[Service]
# Also recover from unexpected exits that report success. An explicit
# systemctl stop still stops the service without restarting it.
Restart=always
RestartSec=5s
# If a child is killed by the OOM killer, stop the whole service before retrying.
OOMPolicy=kill
