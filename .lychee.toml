# These existing author profiles return HTTP 403 to automated clients, and
# crates.io answers a crate page only when the client asks for HTML: a plain GET
# returns 404 for every crate, serde included. Keep checking all other URLs,
# including GitHub release and support links.
exclude = [
    '^https://x[.]com/(studio_yebisu|remydre8|PENTACoXIAN)/?$',
    '^https://crates[.]io/crates/',
]
